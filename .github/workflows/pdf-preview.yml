# PR に「/pdf」とコメントしたときだけ PDF をビルドし、PR にリンクを返す。
# push のたびには動かさない（Actions の無料枠を節約するため）。
# 本のリポジトリでは、このファイルを .github/workflows/ へコピーし、BUILD_CMD を「npm run build」にする。
name: PDF preview

on:
  issue_comment:
    types: [created]
  push:
    branches: [feat/pdf-preview-and-fonts]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 番号
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pdf-preview-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  build:
    # PR へのコメントで、本文が /pdf から始まり、書いたのがリポジトリの持ち主か共同編集者のときだけ
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/pdf') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || inputs.pr || '18' }}
      # このリポジトリ（テンプレート本体）では CLI をビルドしてから組版する
      BUILD_CMD: npm run build && npm run start -- build
    steps:
      - name: 受け付けたことをリアクションで示す
        if: github.event_name == 'issue_comment'
        run: gh api -X POST repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes

      - uses: actions/checkout@v4
      - name: PR のブランチへ切り替える
        run: gh pr checkout "$PR"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 本文は M PLUS Rounded 1c、コードは M PLUS 1 Code。どちらも Google Fonts（OFL）から取得する
      - name: フォントを入れる
        run: |
          dir=~/.local/share/fonts; mkdir -p "$dir"
          base=https://github.com/google/fonts/raw/main/ofl
          for w in Regular Medium Bold ExtraBold Black; do
            curl -fsSL -o "$dir/MPLUSRounded1c-$w.ttf" "$base/mplusrounded1c/MPLUSRounded1c-$w.ttf"
          done
          curl -fsSL -o "$dir/MPLUS1Code.ttf" "$base/mplus1code/MPLUS1Code%5Bwght%5D.ttf"
          sudo apt-get install -y -qq fonts-noto-color-emoji poppler-utils > /dev/null
          fc-cache -f > /dev/null
          fc-list | grep -E "M PLUS (Rounded 1c|1 Code)" | head -3

      - name: Chromium を入れる
        run: npx --yes playwright-core install --with-deps chromium

      - name: PDF をビルドする
        run: eval "$BUILD_CMD"

      - name: PR 専用の Release へ PDF を置き、リンクをコメントする
        run: |
          pdf=$(ls -t *.pdf | head -1)
          tag="pr-${PR}-preview"
          sha=$(git rev-parse --short HEAD)
          cp "$pdf" "preview-${sha}.pdf"
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "PR #${PR} の PDF プレビュー" --notes "/pdf コメントで更新されます。" --target "$(git rev-parse HEAD)"
          # 古いPDFは消して、最新の1つだけ残す
          for a in $(gh release view "$tag" --json assets -q '.assets[].name'); do gh release delete-asset "$tag" "$a" -y; done
          gh release upload "$tag" "preview-${sha}.pdf"
          url=$(gh release view "$tag" --json assets -q '.assets[0].url')
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/{print $2}')
          gh pr comment "$PR" --body "PDF をビルドしました（\`${sha}\`、${pages}ページ）: [preview-${sha}.pdf](${url})"

      - name: 失敗したらコメントする
        if: failure()
        run: |
          gh pr comment "$PR" --body "PDF のビルドに失敗しました。ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
